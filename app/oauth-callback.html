<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArcGIS sign-in</title>
</head>
<body>
  <p>Signing in&hellip; this window will close automatically.</p>
  <script>
    // Standard ArcGIS Maps SDK OAuth popup callback: hand the response hash
    // back to the opener's IdentityManager, then close the popup.
    (function () {
      var opener = window.opener;
      if (opener && opener !== window && typeof opener.require === "function") {
        opener.require(["esri/identity/IdentityManager"], function (esriId) {
          esriId.setOAuthResponseHash(window.location.hash);
          window.close();
        });
      } else {
        window.close();
      }
    })();
  </script>
</body>
</html>
